 if(a)h1=`<div class="card"><b>${T[a.t].n}</b>(${m2(a.w)}m × ${m2(a.h)}m)<div class="mu">ドラッグで移動できます</div></div>`+presetRow(a)+`<div class="card"><div class="mu">向き・操作</div><button data-a="rotl">↺ 左回転</button> <button data-a="rot">↻ 右回転</button> <button data-a="dup">コピー</button> <button data-a="del">削除</button></div><details class="card"><summary>数値で細かく変更</summary>`+['x','y','w','h'].map(k=>`<div class="row"><span>${{x:'左からの位置',y:'奥からの位置',w:'幅',h:'奥行'}[k]}(mm)</span><input type="number" step="10" data-q="${k}" value="${a[k]}"></div>`).join('')+'</details>';
 else h1='<div class="card">図形をクリックすると、サイズや向きを変えられます。<div class="mu">左のパーツ一覧から追加もできます。</div></div>';
 const row=(k,l,v,st)=>`<div class="row"><span>${l}</span><input type="number" ${st?'step="'+st+'"':''} data-p="${k}" value="${v}"></div>`;
 let h2=`<div class="card"><b>建物(mm)</b>`+row('W','建物の幅(最大)',S.W)+row('wall','外壁の厚さ',S.wall)+row('fh','階高',S.fh)+row('tot','延べ面積の上限(㎡)',S.tot)+row('stn','階段の段数(0=階高から自動)',S.stn||0)+row('tr','踏面(1段の奥行 mm)',S.tr||225)+row('sw','階段の幅(mm)',S.sw||900)+`<div class="mu">階段: ${SP().n}段・蹴上 ${Math.round(SP().rise)}mm(230mm以下が目安)</div></div>`;
 [0,1,2].forEach(i=>h2+=`<div class="card"><b>${i+1}階</b>`+row('dep'+i,'建物の奥行(mm)',S.dep[i])+row('ext'+i,i==0?'外部の奥行(mm)':i==1?'バルコニー(mm)':'屋根部分(mm)',S.ext[i])+row('max'+i,'広さの上限(㎡)',S.max[i],.1)+'</div>');
 h2+=`<div class="card"><b>敷地(mm)</b>`+row('site_w','道路側の幅',S.site.w)+row('site_d','奥行',S.site.d)+row('site_ox','建物の左位置',S.site.ox)+row('site_front','道路から建物まで',S.site.front)+'</div><button data-a="auto">奥行を面積上限から自動計算</button>';
 $('#side').innerHTML=`<div class="st">${['✔ チェック','🧰 選んだもの','⚙ 条件'].map((n,i)=>`<button data-tab="${i}" class="${i==TAB?'on':''}">${n}</button>`).join('')}</div>`+[h0,h1,h2][TAB]}
function add(t){const x=T[t].k=='o'?0:S.wall,a=mk(t,x,OY(S.f)+S.wall);const z=EXT(S.f)[0];if(t=='bal'&&z){a.x=0;a.y=z[0];a.h=z[1]-z[0]}if(t=='car'||t=='bike')a.y=-a.h-100;S.items[S.f].push(a);S.sel=a.i;TAB=1;draw()}
$('#pal').innerHTML='<div class="mu" style="margin-bottom:8px">パーツをクリックすると図に追加されます</div>'+G.map(([g,ids])=>`<details open><summary>${g}</summary>`+ids.map(t=>`<button data-t="${t}" title="${m2(T[t].w)}×${m2(T[t].h)}m">${T[t].n}</button>`).join('')+'</details>').join('');
$('#pal').onclick=e=>{const t=e.target.dataset.t;if(t){add(t);if(typeof matchMedia!='undefined'&&matchMedia('(max-width:900px)').matches)setV('cv')}};
$('#tabs').onclick=e=>{if(e.target.dataset.f!=null){S.f=+e.target.dataset.f;S.sel=null;draw()}};
const cv=$('#cv'),pt=e=>{const p=cv.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(cv.getScreenCTM().inverse())};
cv.onpointerdown=e=>{const g=e.target.closest('[data-i]');if(!g){S.sel=null;TAB=0;drag={pan:1,x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);draw();return}
 S.sel=+g.dataset.i;TAB=1;const p=pt(e),a=cur();drag={dx:p.x-a.x,dy:p.y-a.y};cv.setPointerCapture(e.pointerId);draw()};
cv.onpointermove=e=>{if(!drag)return;
 if(drag.pan){const k=cv.getScreenCTM().a;PAN[0]-=(e.clientX-drag.x)/k;PAN[1]-=(e.clientY-drag.y)/k;drag.x=e.clientX;drag.y=e.clientY;draw();return}
const a=cur(),p=pt(e),[x,y]=snap(a,p.x-drag.dx,p.y-drag.dy);a.x=x;a.y=y;draw()};
cv.onpointerup=()=>{drag=null};
cv.onwheel=e=>{e.preventDefault();ZM=Math.min(4,Math.max(.6,ZM*(e.deltaY<0?1.15:.87)));draw()};
$('#zm').onclick=e=>{const z=e.target.dataset.z;if(z==null)return;if(z=='0'){ZM=1;PAN=[0,0]}else ZM=Math.min(4,Math.max(.6,ZM*(z=='1'?1.3:.77)));draw()};
$('#nav').onclick=e=>{const v=e.target.dataset.v;if(v)setV(v)};
$('#side').onchange=e=>{const t=e.target,v=parseFloat(t.value);if(isNaN(v))return;
 if(t.dataset.q){const a=cur();if(a)a[t.dataset.q]=Math.round(v)}
 else if(t.dataset.p){const k=t.dataset.p;if(k=='W'||k=='wall'||k=='tot'||k=='fh'||k=='stn'||k=='tr'||k=='sw')S[k]=v;else if(k.startsWith('dep'))S.dep[+k[3]]=Math.round(v);else if(k.startsWith('ext'))S.ext[+k[3]]=Math.round(v);else if(k.startsWith('site_'))S.site[k.slice(5)]=Math.round(v);else S.max[+k[3]]=v;syncStairs()}
 draw()};
$('#side').onclick=e=>{if(e.target.dataset.tab!=null){TAB=+e.target.dataset.tab;draw();return}
 const k=e.target.dataset.a,a=cur(),pi=e.target.dataset.pr;
 if(pi!=null&&a){const p=pn(PRE[pk(a.t)][+pi]),rv=(a.r||0)%2,cx=a.x+a.w/2,cy=a.y+a.h/2;if(p.t)a.t=p.t;a.w=rv?p.h:p.w;a.h=rv?p.w:p.h;a.x=Math.round((cx-a.w/2)/10)*10;a.y=Math.round((cy-a.h/2)/10)*10;draw();return}
 if(!k)return;
 if(k=='auto')S.dep=S.max.map(m=>Math.floor(m*1e6/S.W));
 else if(k=='rot'&&a)rot(a);else if(k=='rotl'&&a)rot(a,3);
 else if(k=='dup'&&a){const b={...a,i:S.nid++,x:a.x+100,y:a.y+100};S.items[S.f].push(b);S.sel=b.i}
 else if(k=='del'&&a){S.items[S.f]=S.items[S.f].filter(x=>x.i!=a.i);S.sel=null}
 draw()};
window.onkeydown=e=>{if(/INPUT/.test(e.target.tagName))return;const a=cur();if(!a)return;
 if(e.key=='r')rot(a);else if(e.key=='R')rot(a,3);
 else if(e.key=='Delete'||e.key=='Backspace'){S.items[S.f]=S.items[S.f].filter(x=>x.i!=a.i);S.sel=null}
 else{const d={ArrowLeft:[-50,0],ArrowRight:[50,0],ArrowUp:[0,-50],ArrowDown:[0,50]}[e.key];if(!d)return;a.x+=d[0];a.y+=d[1]}
 e.preventDefault();draw()};
const dlg=(msg,mode)=>new Promise(res=>{const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;z-index:99;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px';
 o.innerHTML=`<div class="card" style="max-width:420px;width:100%;margin:0;padding:16px"><div style="margin-bottom:10px">${msg}</div>${mode=='text'?'<textarea style="width:100%;height:120px;font:12px monospace;background:var(--pn);color:var(--tx);border:1px solid var(--bd);border-radius:8px"></textarea>':''}<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px">${mode=='ok'?'':'<button data-c="1">キャンセル</button>'}<button class="on" data-c="0">OK</button></div></div>`;
 o.onclick=e=>{const c=e.target.dataset.c;if(c==null)return;const v=o.querySelector('textarea');o.remove();res(c=='1'?null:v?v.value.trim():'')};document.body.appendChild(o)});
$('#sv').onclick=async()=>{const j=JSON.stringify(S);try{await navigator.clipboard.writeText(j);await dlg('プランをコピーしました。LINEなどに貼り付けて友達に送れます','ok')}catch(e){await dlg('コピーできませんでした。下の文字を全部コピーして送ってください:<br><textarea readonly style=\"width:100%;height:90px;font-size:11px\">'+j.replace(/</g,'&lt;')+'</textarea>','ok');}};
$('#lb').onclick=async()=>{const t=await dlg('送られたプランのテキストを貼り付けてください(ファイルから読み込む場合は空のままOK)','text');if(t===null)return;if(t===''){$('#ld').click();return}try{const j=JSON.parse(t);if(j.items&&j.dep&&j.ext&&j.site){S=j;syncStairs();draw()}else await dlg('読み込めませんでした','ok')}catch(x){await dlg('読み込めませんでした','ok')}};
$('#ld').onchange=e=>{const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(j.items&&j.dep&&j.ext&&j.site){S=j;syncStairs();draw()}}catch(x){dlg('読み込めませんでした','ok')}};if(e.target.files[0])r.readAsText(e.target.files[0])};
$('#dl').onclick=()=>{const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));l.download='madori-plan.json';l.click()};
$('#rs').onclick=()=>dlg('配置をすべて初期化しますか?','yn').then(r=>{if(r!==null){init();syncStairs();draw()}});
$('#rt').onclick=()=>{const a=cur();if(a){rot(a);draw()}};
cv.ondblclick=()=>{const a=cur();if(a){rot(a);draw()}};
$('#il').onclick=e=>{ILL=!ILL;e.target.classList.toggle('on',ILL);draw()};
const sdT=()=>$('#sd').textContent='バルコニー/屋根: '+(S.side=='back'?'奥側':'道路側');
$('#sd').onclick=()=>{S.side=S.side=='back'?'front':'back';sdT();draw()};sdT();
const spT=()=>$('#sp').textContent='3F屋根: '+(S.sp3?'上下2分割':'片側');
$('#sp').onclick=()=>{S.sp3=!S.sp3;spT();draw()};spT();
const flT=()=>$('#fl').textContent='床: '+['ナチュラル','ダーク','ホワイト'][S.fl||0];
$('#fl').onclick=()=>{S.fl=((S.fl||0)+1)%3;flT();draw()};flT();
syncStairs();
draw();
</script></body></html>
